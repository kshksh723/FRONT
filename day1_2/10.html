<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표의 구조를 지정하는 thead, tbody, tfoot 태그 </title>
</head>
<body>
    <!-- 표에서는 제목이 표시된 셀과 자료가 표시된 셀 외에 표 아래쪽에 합계나 요약 내용을 표시하기도 한다 이런 표는 제목과 본문 그리고 요약이 있는 부분으로 
     표의 구조를 나누어 놓는 것이 좋다
     이 때 <thead> <tbody> <tfoot> 태그를 사용한다  -->
        <!-- 태그 이름은 표를 뜻하는 table의 't'와 제목 head, 본문 body, 요약 foot을 각각 합친 말이다  -->

  <h2> 상품 구성</h2>
    <table>
    <caption> 선물용과 가정용 상품 구성</caption>
    <thead>
    <tr> 
        <th> 용도 </th>
        <th> 중량 </th>
        <th> 개수 </th>
        <th> 가격 </th>    
    </tr>
</thead>
    <tr>
        <td> 선물용</td>
        <td> 3kg</td>
        <td> 11 ~ 16과</td>
        <td> 35,000원</td>
    </tr>
    <tr>
        <td> 선물용</td>
        <td> 5kg</td>
        <td> 18 ~ 26과</td>
        <td> 52,000원</td>
    </tr>
    <tr>
        <td> 가정용</td>
        <td> 3kg</td>
        <td> 11 ~ 16과</td>
        <td> 52,000원</td>
    </tr>   
    <tr>
        <td> 가정용</td>
        <td> 5kg</td>
        <td> 18 ~ 26과</td>
        <td> 47,000원</td>
    </tr>
</table>
    </body>
</html>
