<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>이 태크는 웹 문서에서 핵심이 되는 내용을 넣는다, main 태그는 웹 문서에서 한번만 사용할 수 있다</main>
    <article> 웹에서 실제로 보여주고 싶은 내용을 넣는다  이 안에 <section> section 태그도 넣을 수 있다 </section> </article>
    <section> 이 태그는 웹 문서에서 콘텐츠 영역을 나타낸다</section>
    <!-- section 태그는 article 태그와 비슷해 보이지만 <section> 태그는 몇 개의 콘텐츠를 묶는 용도로 사용하고,
        article 태그는 블로그의 포스트처럼 독립된 컨텐츠로 쓴다 -->
    <!-- 단순히 스타일을 적용하려고 콘텐츠를 묶으려면 <section> 태그 대신 <div> 태그를 사용한다 -->
</body>
</html>
