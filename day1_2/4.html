<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트입력하기</title>
</head>
<body>
   <h1> 레드향 </h1>
   <h2>레드향 샐러드 레시피</h2>
   <h2> 상품 구성</h2>
   <p> 텍스트 단락을 만드는 p 태그, 텍스트를 입력하면 텍스트 앞뒤로 빈줄이 생기면서 텍스트 단락이 만들어진다 💡 기억해둬야 할 것은 편집기에서 줄을 바꾸더라도 웹 브라우저에서는 한 줄로 표시된다는 것이다
    다만 텍스트 단락의 내용이 길어서 웹 브라우저에 한 줄로 표시할 수 없을 경우 자동으로 줄이 바귄다 
   </p>
   <br> 
   <!-- 줄을 바꿔주는 br 태그 -->
<!-- br태그와 p 태그의 차이점 -->
 <!-- br 태그를 두 번 사용하면 빈 줄이 생기면서 텍스트 단락이 나뉜 것처럼 화면에 표시할 수 있다. 하지만 실제로 단락이 만들어진 게 아니므로 css를 사용해 텍스트 단락 스타일을 적용할 때 문제가 생긴다
  따라서 텍스트 단락이 만들어질 때는 p 태그를 사용해야한다 -->
  <blockquote>인용문 ➡️ 다른 텍스트보다 약간 들여 쓴다</blockquote>
  <!-- 텍스트를 굵게 표시하려면 strong, b 태그를 사용한다 -->
   <strong>굵게 강조할 텍스트</strong>
   <b>굵게 표시할 텍스트 </b>

   <!-- 경고나 주의 사항처럼 중요한 내용을 강조해야할 때 strong 태그를 키워드처럼 단순히 글자만 표시할 때는 b태그를 사용한다 -->

   <!-- 기울인 텍스트를 입력해주는 em, i 태그 -->
    <em> 이탤릭체로 강조할 텍스트</em>
    <i>이탤릭체로 표시할 텍스트</i>
    <!-- i 태그는 마음 속 생각이나 용어, 관용구등에 사용한다 -->
     <!-- em 태그는 문장 중에서 특별히 강조하고 싶은 부분에 사용, 단순히 텍스트와 구별하기 위해 기울여서 표시한다면 i 태그를 사용 -->
</body>
</html>
