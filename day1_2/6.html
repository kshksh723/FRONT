<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록만들기</title>
    <!-- 목록은 단순히 어떤 항목을 나열할 때 뿐만 아니라
        특히 css와 함께 사용해서 네비게이션을 만들거나 콘텐츠를 배치하는 등 다양한 용도로 사용한다  -->
</head>
<body>
    <!-- 순서 있는 목록이란 말 그대로 각 항목을 순서대로 나열한 것이다 -->
     <!-- 순서 목록은 어떤 과정을 순서대로 설명할 때 ol과 li 태그를 사용해 만든다 
      목록을 표시할 내용 앞 뒤에 각각 <ol>과 </ol> 태그를 두고 그 사이에 <li></li> 태그를 삽입한다 
    
      [기본형]
      <ol>
        <li>항목1</li>
        <li>항목2</li>
      </ol>
    -->
</body>
</html>
