<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표 만들기</title>
</head>
<body>
    <!-- 표 table는 행 row와 열 column 그리고 셀 cell로 이루어진다 셀은 행과 열이 만나 이루어진 곳으로 표의 내용이 들어가는 한 칸  -->
<!-- 표를 만드는 <table> , <capiton> 태그 -->
    <!-- 표의 시작과 끝을 알려주는 <table>과 </table> 태그를 표시하고 그 사이에 표와 관련된 태그를 모두 넣는다  -->
     <!-- 표에 제목을 붙이고 싶다면 <table> 태그 바로 아랫줄에 <caption> 태그를 사용한다
         <caption> 태그를 사용하면 제목의 표의 위쪽 중앙에 표시된다
        * capation 태그는 생략할 수 있다  -->
        <table>
            <caption> 표 제목 </caption>
        </table>
</body>
</html>
