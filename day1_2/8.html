<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>행을 만드는 <tr> 태그와 셀을 만드는 <td>,<th> 태그 </title>
</head>
<body>
        <table>
            <tr>
                <td>1행 1열</td>
                <td>1행 2열</td>
            </tr>
            <!-- tr 태그는 행을 만들고 td 태그는 행 안에 있는 셀을 만들기 때문데 table 태그 안에
             tr, td 태그가 모두 모여야 하나의 셀을 만들 수 있다 -->
            <tr>
                <td>2행 1열</td>
                <td>2행 2열</td>
                <!-- 표의 제목 행에 셀을 만들 때는 td 태그 대신 th 태그를 사용한다
                 th 태그를 사용한 내용은 진하게 표시되고 셀 안에서 중앙에 배열 되므로 다른 내용에 비해
                 눈에 띈다 -->
            </tr>
        </table>
</body>
</html>
